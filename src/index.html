<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Maibank</title>
  <base href="/">
  <!-- viewport-fit=cover: o app vai até a barra de gestos do iPhone. Sem zoom: é um app, não uma página. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Suas finanças divididas do seu jeito: lançamentos, crédito, metas e simulações.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#eceef0">

  <!-- Instalado na tela de início, abre como aplicativo (sem a barra do navegador) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maibank">
  <!-- "default" = barra de status sólida, na cor do theme-color. Com "black-translucent" o iOS 26+
       põe um desfoque (Liquid Glass) sobre o topo do app. O iPhone só lê isto ao instalar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <script>
    // Tema salvo: cromado claro (padrão) ou cromado escuro — ver AppearanceService.
    // A barra de status (e a do navegador) usa a cor do topo do tema.
    var maibankTheme = 'light';
    try {
      if (localStorage.getItem('maibank-theme-v2') === '1' && localStorage.getItem('maibank-theme') === 'dark') {
        maibankTheme = 'dark';
      }
    } catch (e) {}
    document.querySelector('meta[name="theme-color"]').content = { light: '#eceef0', dark: '#2b2c30' }[maibankTheme];

    // O Safari ignora "user-scalable=no" por acessibilidade; em tela de toque, bloqueia a pinça aqui.
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (event) { event.preventDefault(); }, { passive: false });
      });
    }
  </script>
</head>
<body>
  <script>
    // Aplica o tema antes do app carregar: sem o "flash" branco ao abrir.
    document.body.setAttribute('data-theme', maibankTheme);
  </script>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar o Maibank.</noscript>
</body>
</html>
