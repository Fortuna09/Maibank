<h1 class="auth-title">Criar nova senha</h1>
<p class="auth-sub">Escolha uma senha nova. Ao salvar, as outras sessões abertas da sua conta são encerradas.</p>

@if (tokenInvalid()) {
  <p class="form-error" role="alert">
    <app-icon name="alert" [size]="15" />
    {{ error() }}
  </p>
  <a class="btn primary block" routerLink="/esqueci-senha">Pedir um novo link</a>
} @else {
  <form class="auth-form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <span>Nova senha</span>
      <span class="input-with-action">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="new-password"
          aria-label="Nova senha"
          [(ngModel)]="password"
          maxlength="72"
          autofocus
        />
        <button
          type="button"
          class="input-action"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Esconder senha' : 'Mostrar senha'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="15" />
        </button>
      </span>
      <p class="field-hint">Mínimo de 8 caracteres.</p>
    </div>

    <label class="field">
      <span>Repita a senha</span>
      <input [type]="showPassword() ? 'text' : 'password'" name="confirmation" autocomplete="new-password" [(ngModel)]="confirmation" maxlength="72" />
    </label>

    @if (error()) {
      <p class="form-error" role="alert">
        <app-icon name="alert" [size]="15" />
        {{ error() }}
      </p>
    }

    <button type="submit" class="btn primary block" [disabled]="loading()" [class.is-loading]="loading()">Salvar nova senha</button>
  </form>
}

<p class="auth-switch">Lembrou a senha? <a routerLink="/entrar">Entrar</a></p>
