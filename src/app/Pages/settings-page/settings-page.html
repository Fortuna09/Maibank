<main class="page section-shell" aria-label="Configurações">
  <div class="subnav-wrap">
    <div class="page-inner">
      <nav class="subnav" aria-label="Seções de configurações" appScrollActiveTab>
        @for (section of sections(); track section.path) {
          <a [routerLink]="section.path" routerLinkActive="active-tab">{{ section.label }}</a>
        }
      </nav>
    </div>
  </div>

  <div class="page-inner subnav-panel" aria-live="polite">
    <router-outlet />
  </div>
</main>
