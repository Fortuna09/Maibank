<section class="section-card minimal">
  <header class="chart-header">
    <h2>Fluxo mensal</h2>
    <!-- Legenda centralizada e única -->
    <div class="legend">
      <span class="dot-income" aria-hidden="true"></span> Entradas
      <span class="dot-expense" aria-hidden="true"></span> Saídas
    </div>
  </header>

  <div class="chart-container" *ngIf="monthlyData().length > 0; else emptyState">
    <div class="chart-row" *ngFor="let month of monthlyData()">
      <div class="month-label">{{ month.month }}</div>
      
      <div class="bars">
        <div class="bar-track">
          <div class="bar-fill income" [style.width.%]="getBarWidth(month.entradas, getScale(month.entradas, month.saidas))"></div>
          <span class="value">{{ month.entradas | currency: 'BRL' }}</span>
        </div>

        <div class="bar-track">
          <div class="bar-fill expense" [style.width.%]="getBarWidth(month.saidas, getScale(month.entradas, month.saidas))"></div>
          <span class="value">{{ month.saidas | currency: 'BRL' }}</span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <p class="empty-state">Nenhum lançamento adicionado neste período.</p>
  </ng-template>
</section>
