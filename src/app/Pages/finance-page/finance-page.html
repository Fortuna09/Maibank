<div class="finance-layout">
  <app-nav-bar />

  <main class="finance-content" aria-label="Painel financeiro principal">
    <header class="finance-sidebar" aria-label="Menu financeiro horizontal">
      <nav class="finance-subnav" aria-label="Navegação interna do painel financeiro">
        <a routerLink="geral" routerLinkActive="active-tab" [routerLinkActiveOptions]="{ exact: true }">
          <span class="nav-icon">◉</span>
          Geral
        </a>
        <a routerLink="lancamentos" routerLinkActive="active-tab">
          <span class="nav-icon">◌</span>
          Lançamentos
        </a>
        <a routerLink="metas" routerLinkActive="active-tab">
          <span class="nav-icon">◎</span>
          Metas
        </a>
        <a routerLink="configuracao" routerLinkActive="active-tab">
          <span class="nav-icon">⚙</span>
          Configuração
        </a>
      </nav>

      <div class="sidebar-summary">
        <p>Organize metas, divisões e regras do seu orçamento em um só lugar.</p>
      </div>
    </header>

    <section class="finance-workspace">
      <section class="finance-panel" aria-live="polite">
        <router-outlet />
      </section>
    </section>
  </main>
</div>
