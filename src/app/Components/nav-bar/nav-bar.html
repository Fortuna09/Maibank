<nav class="sidebar" [class.sidebar-collapsed]="!isMenuOpen" [class.nav-open]="isMenuOpen" aria-label="Navegação principal">
  <div class="nav-topbar">
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Abrir ou fechar menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="brand" aria-label="Maibank">
      <span class="brand-name">Maibank</span>
    </div>
  </div>

  <div class="nav-items" role="list">
    <a
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Ir para página inicial"
    >
      <span class="nav-icon"><app-icon name="home" [size]="18" /></span>
      <span class="nav-label">Início</span>
    </a>

    <a routerLink="/lancamentos" routerLinkActive="active-link" data-tour="nav-lancamentos" aria-label="Ir para lançamentos">
      <span class="nav-icon"><app-icon name="wallet" [size]="18" /></span>
      <span class="nav-label">Lançamentos</span>
    </a>

    <a routerLink="/metas" routerLinkActive="active-link" data-tour="nav-metas" aria-label="Ir para metas">
      <span class="nav-icon"><app-icon name="target" [size]="18" /></span>
      <span class="nav-label">Metas</span>
    </a>

    <a routerLink="/credito" routerLinkActive="active-link" data-tour="nav-credito" aria-label="Ir para crédito">
      <span class="nav-icon"><app-icon name="card" [size]="18" /></span>
      <span class="nav-label">Crédito</span>
    </a>

    <a routerLink="/simulacao" routerLinkActive="active-link" data-tour="nav-simulacao" aria-label="Ir para simulações">
      <span class="nav-icon"><app-icon name="trend-up" [size]="18" /></span>
      <span class="nav-label">Simulação</span>
    </a>

    <button
      type="button"
      class="nav-button nav-mai"
      data-tour="nav-mai"
      [class.active-link]="assistant.isVisible()"
      [class.is-thinking]="assistant.thinking()"
      (click)="assistant.toggle()"
      aria-label="Abrir ou fechar a Mai, sua assistente"
      title="Mai · assistente (Ctrl+I)"
    >
      <span class="nav-icon"><app-mai-mark [size]="16" [active]="assistant.thinking()" /></span>
      <span class="nav-label">Mai <small>assistente</small></span>
      @if (assistant.unread() > 0 && !assistant.isVisible()) {
        <span class="nav-badge">{{ assistant.unread() }}</span>
      }
    </button>
  </div>

  <div class="nav-footer">
    <button type="button" class="help-toggle" data-tour="nav-help" (click)="tour.start()" aria-label="Abrir o tour guiado" title="Tour guiado e ajuda">
      <app-icon name="help" [size]="18" />
    </button>
    <a class="settings-toggle" data-tour="nav-config" routerLink="/configuracoes" routerLinkActive="active-link" aria-label="Abrir configurações">
      <span class="nav-icon"><app-icon name="settings" [size]="18" /></span>
      <span class="theme-label">Configurações</span>
    </a>
  </div>

  <a class="nav-version" routerLink="/configuracoes/novidades" title="Novidades e histórico de versões">v{{ version }}</a>
</nav>

<!-- Celular: barra superior com o nome da seção e os atalhos -->
<header class="mobile-topbar">
  <div class="mobile-heading" [class.is-home]="!topbar().back && topbar().title === 'Maibank'">
    @if (topbar().back; as back) {
      <a class="topbar-back" [routerLink]="back" aria-label="Voltar para Configurações">
        <app-icon name="chevron-left" [size]="22" />
      </a>
    }
    <h1 class="mobile-title">{{ topbar().title }}</h1>
  </div>

  <div class="mobile-actions">
    <button type="button" class="topbar-btn" data-tour="nav-help" (click)="tour.start()" aria-label="Abrir o tour guiado">
      <app-icon name="help" [size]="20" />
    </button>
    <button
      type="button"
      class="topbar-btn topbar-mai"
      data-tour="nav-mai"
      [class.is-active]="assistant.isVisible()"
      (click)="assistant.toggle()"
      aria-label="Abrir ou fechar a Mai, sua assistente"
    >
      <app-mai-mark [size]="18" [active]="assistant.thinking()" />
      @if (assistant.unread() > 0 && !assistant.isVisible()) {
        <span class="topbar-badge">{{ assistant.unread() }}</span>
      }
    </button>
    <a class="topbar-btn" data-tour="nav-config" routerLink="/configuracoes" routerLinkActive="is-active" aria-label="Abrir configurações">
      <app-icon name="settings" [size]="20" />
    </a>
  </div>
</header>

<!-- Celular: abas fixas embaixo, ao alcance do polegar -->
<nav class="tabbar" aria-label="Navegação principal">
  <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
    <app-icon name="home" [size]="21" />
    <span>Início</span>
  </a>
  <a routerLink="/lancamentos" routerLinkActive="is-active" data-tour="nav-lancamentos">
    <app-icon name="wallet" [size]="21" />
    <span>Lançamentos</span>
  </a>
  <a routerLink="/metas" routerLinkActive="is-active" data-tour="nav-metas">
    <app-icon name="target" [size]="21" />
    <span>Metas</span>
  </a>
  <a routerLink="/credito" routerLinkActive="is-active" data-tour="nav-credito">
    <app-icon name="card" [size]="21" />
    <span>Crédito</span>
  </a>
  <a routerLink="/simulacao" routerLinkActive="is-active" data-tour="nav-simulacao">
    <app-icon name="trend-up" [size]="21" />
    <span>Simulação</span>
  </a>
</nav>
